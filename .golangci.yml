version: "2"
linters:
  default: standard
  enable:
    - misspell
    - errorlint
    - gocritic
    - nilerr
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Output to the terminal: nothing sensible to do on failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/qunaxis/skenv
